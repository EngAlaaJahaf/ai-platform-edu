name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt 2>/dev/null || pip install fastapi uvicorn python-dotenv 2>/dev/null || true
      - run: python -m py_compile backend/main.py backend/database.py backend/routes/api.py || true

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: frontend
        run: npm ci || npm install
      - working-directory: frontend
        run: npm run build || npm run lint || true
