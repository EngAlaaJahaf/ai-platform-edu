services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduai-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8001
      - EDUAI_DB_PATH=/data/eduai.db
    volumes:
      - eduai_db:/data
      - eduai_uploads:/app/backend/uploads
      - eduai_presentations:/app/backend/presentations
      - eduai_art:/app/backend/presentation_engine/art
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - eduai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - eduai-net

networks:
  eduai-net:
    driver: bridge

volumes:
  eduai_db:
  eduai_uploads:
  eduai_presentations:
  eduai_art: